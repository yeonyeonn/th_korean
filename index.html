<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>이태형T 국어 O/X 진단</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: 한 장의 OMR 답안지 카드. 영역 선택 → 문항별 O/X 마킹 → 영역별 처방 */
:root{
  --paper:#f2f5f3; --card:#ffffff; --ink:#18261f; --muted:#5f6d66;
  --omr:#1f7a4d; --omr-soft:#e3f1e9; --rule:#d2e4d9; --ok:#2b5c8a; --ok-soft:#e5eef7;
  --display:"Gowun Batang", "Noto Serif KR", serif;
  --body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1411; --card:#18201b; --ink:#e4ece7; --muted:#97a69e;
  --omr:#5fd49a; --omr-soft:#173226; --rule:#2c463a; --ok:#8fb8e6; --ok-soft:#1b2a3a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1411; --card:#18201b; --ink:#e4ece7; --muted:#97a69e;
  --omr:#5fd49a; --omr-soft:#173226; --rule:#2c463a; --ok:#8fb8e6; --ok-soft:#1b2a3a; color-scheme:dark}

body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.5rem;font-weight:700;letter-spacing:-.01em}
.brand span{color:var(--omr)}
.sub{font-size:.8rem;color:var(--muted);letter-spacing:.04em}

.sheet{background:var(--card);border:1.5px solid var(--omr);border-radius:6px;overflow:hidden}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 18px;border-bottom:1.5px solid var(--omr);
  background:var(--omr-soft);color:var(--omr);font-size:.78rem;font-weight:600;letter-spacing:.08em}
.bar{flex:1;max-width:180px;height:6px;border-radius:3px;border:1.5px solid var(--omr);overflow:hidden}
.bar i{display:block;height:100%;background:var(--omr);transition:width .2s}
.sheet-body{padding:26px 22px 24px;display:flex;flex-direction:column;gap:20px}
.lined{background-image:repeating-linear-gradient(to bottom,transparent 0 35px,var(--rule) 35px 36px)}

h2{font-family:var(--display);font-size:1.35rem;line-height:1.45;margin:0;text-wrap:balance}
.lead{margin:0;color:var(--muted);font-size:.95rem}

/* 영역 선택 */
.areas{display:flex;flex-direction:column;gap:10px}
.area{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;border:1.5px solid var(--rule);border-radius:6px;
  padding:12px 14px;cursor:pointer;background:var(--card)}
.area input{position:absolute;opacity:0;pointer-events:none}
.area .box{width:24px;height:24px;border-radius:50%;border:2px solid var(--omr);display:grid;place-items:center}
.area .box::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--omr);transform:scale(0);transition:transform .12s}
.area:has(input:checked){border-color:var(--omr)}
.area:has(input:checked) .box::after{transform:scale(1)}
.area:has(input:focus-visible){outline:3px solid var(--omr);outline-offset:2px}
.area b{display:block;font-family:var(--display);font-size:1.1rem}
.area small{color:var(--muted);font-size:.85rem}
.area .cnt{font-size:.82rem;color:var(--omr);font-weight:600;white-space:nowrap}

/* 문항 */
.qmeta{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.qtag{font-size:.75rem;font-weight:600;letter-spacing:.08em;color:var(--omr);border:1.5px solid var(--omr);border-radius:4px;padding:1px 8px}
.qno{font-family:var(--display);color:var(--omr);font-weight:700}
.q{font-family:var(--display);font-size:1.32rem;line-height:1.55;font-weight:700;text-wrap:balance;margin:6px 0 0}
.hint{font-size:.88rem;color:var(--muted);margin:0}
.marks{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mark{appearance:none;border:1.5px solid var(--omr);background:var(--card);color:var(--ink);border-radius:999px;
  padding:14px 10px;display:flex;align-items:center;justify-content:center;gap:12px;font:600 1rem var(--body);cursor:pointer;transition:transform .1s}
.mark .b{width:34px;height:34px;border-radius:50%;border:2px solid var(--omr);display:grid;place-items:center;
  font-family:var(--display);font-weight:700;color:var(--omr);font-size:1.05rem;transition:background .15s,color .15s}
.mark:hover .b,.mark:focus-visible .b,.mark.on .b{background:var(--omr);color:var(--card)}
.mark:active{transform:scale(.98)}
.mark:focus-visible{outline:3px solid var(--omr);outline-offset:3px}

.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.link{appearance:none;background:none;border:0;color:var(--muted);font:500 .9rem var(--body);cursor:pointer;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--ink)}
.link:disabled{opacity:.35;cursor:default;text-decoration:none}
.primary{appearance:none;border:0;background:var(--omr);color:var(--card);font:600 1rem var(--body);border-radius:999px;padding:13px 18px;cursor:pointer}
.primary:disabled{opacity:.4;cursor:default}
.secondary{appearance:none;border:1.5px solid var(--omr);background:var(--card);color:var(--omr);font:600 1rem var(--body);border-radius:999px;padding:12px 18px;cursor:pointer}
.primary:focus-visible,.secondary:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* 결과 */
.score{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.score div{border:1.5px solid var(--rule);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column}
.score b{font-family:var(--display);font-size:1rem}
.score span{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.score em{font-style:normal;color:var(--omr);font-weight:700;font-size:1.15rem}
.score .top{border-color:var(--omr);background:var(--omr-soft)}
.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1.5px solid var(--omr);padding-bottom:6px}
.sec-h h3{margin:0;font-family:var(--display);font-size:1.15rem}
.sec-h span{font-size:.8rem;color:var(--muted)}
.rx{border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.rx-q{display:grid;grid-template-columns:26px 1fr;gap:8px;padding:12px 14px;background:var(--omr-soft);font-weight:600;font-size:.95rem}
.rx-q i{font-style:normal;font-family:var(--display);color:var(--omr);font-weight:700}
.rx ul{margin:0;padding:12px 14px 14px 32px;display:flex;flex-direction:column;gap:6px;font-size:.94rem}
.rx li::marker{color:var(--omr)}
.rx .sol{display:block;font-size:.72rem;font-weight:700;letter-spacing:.1em;color:var(--ok);padding:10px 14px 0}
.none{font-size:.9rem;color:var(--muted);margin:0}
.empty{border:1.5px dashed var(--ok);background:var(--ok-soft);color:var(--ok);border-radius:6px;padding:14px 16px}
.toast{font-size:.85rem;color:var(--ok);min-height:1.2em;margin:0;text-align:center}
textarea.copybox{width:100%;min-height:140px;font:.85rem/1.5 var(--body);border:1px solid var(--rule);border-radius:6px;padding:10px;background:var(--card);color:var(--ink);box-sizing:border-box}

details{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:12px 16px}
summary{cursor:pointer;font-weight:600;font-size:.92rem}
details p.note{font-size:.88rem;color:var(--muted);margin:10px 0}
.all h4{font-family:var(--display);margin:16px 0 6px;color:var(--omr)}
.all ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px;font-size:.88rem}
.all ol div{color:var(--muted)}

.area{grid-template-columns:28px 1fr auto}
.q.sm{font-size:1.1rem;color:var(--muted)}
.sols{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;font-size:1.02rem}
.sols li{display:grid;grid-template-columns:18px 1fr;gap:8px}
.sols li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--omr);margin-top:.6em}
.sec h3{margin:0;font-family:var(--display);font-size:1.15rem;border-bottom:1.5px solid var(--omr);padding-bottom:6px}
details.rx{padding:0;background:none}
.toast:empty{display:none}
details.rx summary{list-style:none;cursor:pointer}
details.rx summary::-webkit-details-marker{display:none}
details.rx summary::after{content:"+";margin-left:auto;color:var(--omr);font-weight:700}
details.rx[open] summary::after{content:"−"}
details.rx .rx-q{grid-template-columns:26px 1fr auto}
.name{width:100%;box-sizing:border-box;font:1.1rem var(--body);color:var(--ink);background:var(--card);border:1.5px solid var(--rule);border-radius:6px;padding:10px 12px;min-width:0}
.name:focus{outline:none;border-color:var(--omr)}
.consent{display:grid;grid-template-columns:20px 1fr;gap:8px;align-items:start;font-size:.85rem;color:var(--muted);cursor:pointer}
.consent input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--omr)}
.who{margin:0 0 2px;color:var(--omr);font-weight:600;font-size:.9rem}
.save{margin:0;font-size:.88rem;color:var(--muted)}
.save.ok{color:var(--ok)}
.save.err{color:var(--omr)}
.fade{animation:in .22s ease}
@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.mark,.bar i,.area .box::after{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">이태형T <span>국어</span></div>
  </header>

  <section class="sheet" aria-live="polite">
    <div class="sheet-head"><span id="headLabel">답안지</span><span class="bar" id="barWrap" hidden><i id="bar"></i></span></div>
    <div class="sheet-body fade" id="view"></div>
  </section>

</div>

<script>
const MODE = "batch"; // "batch": 마지막에 모아 보기 / "instant": O 고를 때마다 바로 보기
const SHEET_URL = "https://script.google.com/macros/s/AKfycbxsvXk0ymhfbVNWKAqwCKFdEA2CudVyaBXX8FKUV2Aw6QUXmZgKkLcuM2N7Uz2wtayC/exec";
const CONSENT = "입력한 이름과 답변이 이태형T 국어 상담 자료로 사용되는 것에 동의합니다."; // 동의 문구
/* ===== 문항 데이터: 이 부분만 고치면 됩니다 ===== */
const AREAS = [
 {key:"read", name:"독서", desc:"비문학 지문 읽기와 문제 풀이", items:[
  {q:"글 자체를 이해하지 못할 때가 자주 있다.", hint:"10번 중 3~4번꼴", sol:[
    "글을 충분히 천천히 읽고 있는지 생각해보기.",
    "보통 글 읽기와 문제 풀기는 7:3에서 6:4 정도가 가장 이상적인 배분인데, 글 자체를 이해하지 못하는 경우가 많다면 아마 이 비율이 지켜지지 않았을 가능성이 높음.",
    "그런데 글을 느리게 읽는데도 잘 이해가 안 가는 경우가 많다면, 원인은 문장 하나를 머리로 이해하려 해서임.",
    "정보를 글에 나와 있는 정보와 연결 지을 생각을 해야지, 그때그때 본인의 지식을 활용하려는 경우를 줄이도록!"]},
  {q:"항상 독서 시간이 오래 걸린다.", hint:"평균 의대생 기준 35분 이상", sol:[
    "내가 너무 모든 문장을 이해하려 하고, 모든 선지를 다 해결하려 하는지 고민해보기.",
    "사실 문장 하나하나의 이해보다는 글 자체의 연결성이 더 중요함.",
    "문제는 주관식으로 생각해서, 내 생각과 일치하는 선지를 골라야 하는 경우가 더 많음!"]},
  {q:"지문 내용은 정확하게 이해한 것 같은데, 문제를 자꾸 틀린다.", sol:[
    "읽는 속도 점검 필요.",
    "사후적인 해설 자주 들어보기.",
    "내가 읽는 것에 문제가 없다면 출제 포인트를 모르는 경우가 많아서, 사후적 해설이 은근 도움이 많이 됨."]},
  {q:"인문 지문에서 철학자들이 하는 말을 정확하게 못 알아듣겠다.", sol:[
    "주장을 잡는 연습하기.",
    "그 주장을 꽉 잡고, 밑에는 근거라고 생각하기.",
    "주장의 언어들이 어떻게 다르게 표현되었는지를 생각!"]},
  {q:"인문 지문이 정보량이 많게 느껴진다.", sol:[
    "주장 명확하게 잡기.",
    "개념어들이 등장하면 초반에는 옆에 도식화를 그림으로 그려두면서 연습하고, 익숙해지면 머리로 하기."]},
  {q:"사회 지문에서 상황 자체가 안 와닿는다.", sol:[
    "주어와 '언제부터'를 먼저 잡고, 그다음에 행동들을 잡기.",
    "그래야 큰 틀이 먼저 짜여짐."]},
  {q:"사회 지문에서 개념어가 많이 나오면 혼란스럽다.", sol:[
    "용어에 집중하지 말고 수식어에 집중하기.",
    "그래야 단어 자체를 힘들어하지 않고, 정의를 명확하게 파악할 수 있음."]},
  {q:"과학·기술 지문에서 너무 많은 정보량이 처리되지 않는다.", sol:[
    "맨 처음과 맨 끝을 잡은 다음, 가운데를 채워 나가는 식으로 생각하기.",
    "절대 외울 생각을 하지 말고 위치 기억에 집중하기."]},
  {q:"갈래 상관없이, 읽을 때 뭘 해야 할지 모르겠다.", sol:[
    "초반에 수업을 열심히 들어주는 게 좋음."]},
  {q:"나는 독서를 완벽하게 다 맞지는 못한다.", sol:[
    "내가 틀리는 특정 유형의 문제들을 몰아두기.",
    "주관식으로 생각하는 연습하기."]}
 ]},
 {key:"lit", name:"문학", desc:"시·소설·고전·수필", items:[
  {q:"문학 시간 관리가 안 된다.", hint:"평균 의대생 기준 27분", sol:[
    "내가 문학을 '해석해서' 푸는지 생각해보기.",
    "문학은 절대로 정서를 가지고 출제하지 않음. 객관적으로 선지를 바라보는 연습하기.",
    "예) '화자의 슬픔'이라는 선지가 나오면, 화자의 정서가 맞는지를 물어보는 거지 슬픔에 대한 판단을 요구하지 않음."]},
  {q:"현대시를 읽을 때 내용을 이해하지 못하는 경우가 많다.", sol:[
    "당장 해법문학을 사서, 자주 나오는 현대시의 주제를 읽기.",
    "한 2주 각 잡고 자주 읽어보기."]},
  {q:"현대시 중 추상적인 시들을 읽을 때 잘 와닿지 않는 경우가 많다.", hint:"예: 2709 가오리, 2609 달빛 체질", sol:[
    "추상적인 시들은 더더욱 주제를 물어보지 않음.",
    "표면적인 사실 정보에 대한 판단이 더 중요하다는 걸 인지하기."]},
  {q:"고전시가에서 모르는 용어들을 마주하면 버벅인다.", sol:[
    "학기 초반에는 고전 용어 공부를 많이 정리하기.",
    "모르는 단어라면 사실 의미 없는 단어일 확률이 높음. 특히 명사는 더더욱 기억할 필요 없음.",
    "서술어 정도만 모르는 것을 찾아보고 암기하기.",
    "시험장에서 모르는 단어가 나오면 그 단어를 빼고 읽어보는 연습하기."]},
  {q:"고전시가에서 작품 내용은 다 파악하는데 문제를 틀린다.", sol:[
    "선지에서 사소한 한 단어나 어미 같은 사실 정보를 캐치하지 못해서 틀렸을 확률이 높음.",
    "기출을 공부할 때 틀린 부분에 X표 치면서, 답 근거를 최대한 정서 말고 나머지 부분에서 찾아보기."]},
  {q:"현대소설에서 작품 내용을 모를 때가 많다.", sol:[
    "현대소설은 주제가 정말 뻔함. 특히 수능에 나오는 범위는 더더욱.",
    "작품을 많이 읽어보기. 해법문학 추천."]},
  {q:"고전소설에서 시간이 오래 걸리거나, 정답률이 낮았던 경험이 있다.", sol:[
    "고전소설에서 많이 틀린다면 보통 인물 관계도를 그리며 읽어서인데, 사실 인물보다는 공간과 시간을 먼저 잡고, 그 후에 인물, 그다음 행동을 잡기.",
    "선지의 앞부분과 중간 부분에 집중하기. 뒷부분은 거의 대부분 맞는 내용으로 나옴.",
    "서술어에 집중하지 말고 공간·시간 단위로 잘라두기.",
    "선지에서 물어보면 그 장면이 어디쯤이었는지 떠올릴 수 있게, 기술 지문처럼 위치를 기억하는 정도로만 읽기."]},
  {q:"복합갈래에서 시간을 너무 많이 쓴다.", hint:"8분 이상", sol:[
    "선지의 정보화 연습하기.",
    "선지의 정보화란, 내가 맞다고 판단한 선지가 다른 문제에서도 힘을 발휘하게 해서, 선지 판단을 여러 번 하는 과정을 줄이는 것."]},
  {q:"수필을 다 읽고도 이해를 못 하는 경우가 많다.", sol:[
    "수필의 주제는 10000000000% 마지막 문단에 있음.",
    "마지막 문단부터 읽고, 그 주제에 맞춰 위로 올라가서 다시 읽는 연습해보기."]},
  {q:"표현법을 자꾸 틀린다.", sol:[
    "개념 정의 공부를 할 게 아니라, 이 표현법이 나오면 뭘 찾아야 하는지를 공부하기.",
    "선생님들한테 최대한 많이 질문하기."]},
  {q:"나는 문학을 완벽하게 다 맞지는 못한다.", sol:[
    "감으로 푸는 학생들 대부분이 문학을 완벽하게 다 맞지 못함.",
    "제발 선지의 어느 포인트가 틀렸는지 명확하게 X표 치면서 기출 선지들을 모아두기. 사탐(윤리) 공부와 비슷함."]}
 ]},
 {key:"exam", name:"시험 운용", desc:"국어뿐 아니라 전 과목 해당", items:[
  {q:"모의고사는 잘 보는데, 수능장에서만 실수하거나 항상 낮게 나온다.", sol:[
    "장수생인 경우에 보통 이런 경우가 많음.",
    "역설적이지만, 수능을 절대 중요한 시험으로 생각하지 않는 연습하기.",
    "인생의 행복 요소는 더 다양함. 그 대학이 퀄을 살짝 다르게 해줄 뿐, 제발 수능을 중요하게 생각하지 않기."]},
  {q:"수능뿐만 아니라 모의고사에서도 점수가 잘 나오지 않는다.", sol:[
    "본인은 시험에 취약한 사람임. 그럴수록 공부를 암기로 할 필요가 있음.",
    "그날그날 컨디션이 아니라 암기된 지식을 바탕으로 풀 수 있어야 함.",
    "국어는 기출의 논리들이 전부 암기될 필요가 있음. 글을 읽으면서 '몇 년도 몇 월이랑 비슷하게 전개된다'는 느낌이 바로 들어야 함."]},
  {q:"시험만 보면 머릿속이 하얘진다.", sol:[
    "최대한 많은 문제를 기계적으로 푸는 연습이 필요함.",
    "습관화되는 능력이 부족한 것이기 때문에, 국어든 다른 과목이든 습관처럼 풀 수 있는 스킬이 필요함."]},
  {q:"항상 시간 관리를 못 한다.", sol:[
    "시간을 신경 쓰면서 푸니까 시간 관리가 안 되는 경우가 많음.",
    "문제의 정답률을 높이는 방향으로 공부하면 시간은 알아서 줄어듦.",
    "제발 선생님과 상담받자. 절대 EBS로 극복하려 하지 않기."]},
  {q:"둘 중에 하나 고민되는 경우가 너무 많다.", sol:[
    "앞으로 문제를 주관식으로 많이 풀어보기.",
    "선지에서 내가 어디를 판단하고 있었는지 밑줄 쳐보고, 두 번째 판단할 때는 그 밑줄 이외의 부분을 판단하는 습관 기르기."]}
 ]}
];
/* ============================================ */
AREAS.forEach(a=>a.items.forEach((it,i)=>{it.id=a.key+(i+1);it.no=i+1;it.area=a;it.label=a.name+(i+1)}));
const view=document.getElementById('view'), headLabel=document.getElementById('headLabel'),
      barWrap=document.getElementById('barWrap'), bar=document.getElementById('bar');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let selected=new Set(), queue=[], idx=0, answers={}, screen='start';
let student={name:'',agree:false}, attemptId='';

function paint(html, label, lined){
  view.className='sheet-body fade'+(lined?' lined':''); void view.offsetWidth;
  view.innerHTML=html; headLabel.textContent=label;
}
const meta=it=>`<div class="qmeta"><span class="qtag">${it.area.name}</span><span class="qno">${it.no} / ${it.area.items.length}</span></div>`;

function start(){
  screen='start'; barWrap.hidden=true;
  paint(`
    <h2>이름을 입력해 주세요</h2>
    <input class="name" id="nm" maxlength="20" autocomplete="off" aria-label="이름" placeholder="이름" value="${esc(student.name)}">
    <label class="consent" for="agree"><input type="checkbox" id="agree" ${student.agree?'checked':''}><span>${esc(CONSENT)}</span></label>
    <button class="primary" id="go">시작 · ${AREAS.reduce((n,a)=>n+a.items.length,0)}문항</button>`, '시작', false);
  const go=document.getElementById('go'), nm=document.getElementById('nm'), ag=document.getElementById('agree');
  const sync=()=>{ student.name=nm.value.trim(); student.agree=ag.checked; go.disabled=!(student.name&&student.agree); };
  nm.oninput=ag.onchange=sync; sync();
  nm.onkeydown=e=>{ if(e.key==='Enter'&&!go.disabled) go.click(); };
  go.onclick=begin;
}

function begin(){
  selected=new Set(AREAS.map(a=>a.key));
  queue=AREAS.flatMap(a=>a.items); idx=0; answers={};
  attemptId=Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  question();
}

function question(){
  screen='q'; barWrap.hidden=false;
  const it=queue[idx], prev=answers[it.id];
  bar.style.width=(idx/queue.length*100)+'%';
  paint(`
    <div>${meta(it)}<p class="q">${esc(it.q)}</p>${it.hint?`<p class="hint">${esc(it.hint)}</p>`:''}</div>
    <div class="marks">
      <button class="mark ${prev==='O'?'on':''}" data-a="O"><span class="b">O</span>그렇다</button>
      <button class="mark ${prev==='X'?'on':''}" data-a="X"><span class="b">X</span>아니다</button>
    </div>
    <div class="nav"><button class="link" id="back">이전</button></div>`, '답안지', true);
  view.querySelectorAll('.mark').forEach(b=>b.onclick=()=>answer(b.dataset.a));
  document.getElementById('back').onclick=()=>{ if(idx){idx--;question();} else start(); };
}

function answer(a){
  answers[queue[idx].id]=a;
  if(MODE==='instant' && a==='O') solution(); else next();
}
function next(){ if(idx<queue.length-1){idx++;question();} else result(); }

function solution(){
  screen='s';
  const it=queue[idx], last=idx===queue.length-1;
  paint(`
    <div>${meta(it)}<p class="q sm">${esc(it.q)}</p></div>
    <ul class="sols">${it.sol.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>
    <button class="primary" id="nx">${last?'결과 보기':'다음 문항'}</button>
    <div class="nav"><button class="link" id="back">답 고치기</button></div>`, '해결책', false);
  document.getElementById('nx').onclick=next;
  document.getElementById('back').onclick=question;
}

function result(){
  screen='r'; barWrap.hidden=false; bar.style.width='100%';
  const areas=AREAS.filter(a=>selected.has(a.key));
  const picked=a=>a.items.filter(it=>answers[it.id]==='O');
  const totalO=areas.reduce((n,a)=>n+picked(a).length,0);
  const max=Math.max(...areas.map(a=>picked(a).length));
  const who=student.name;
  const item=it=>MODE==='instant'
    ? `<details class="rx"><summary class="rx-q"><i>${it.no}</i><span>${esc(it.q)}</span></summary><ul>${it.sol.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></details>`
    : `<div class="rx"><div class="rx-q"><i>${it.no}</i><span>${esc(it.q)}</span></div><ul>${it.sol.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>`;
  paint(`
    <div><p class="who">${esc(who)}</p><h2>${totalO?`체크한 고민 ${totalO}개`:'체크한 고민이 없어요'}</h2></div>
    ${SHEET_URL?'<p class="save" id="save"></p>':''}
    <div class="score">${areas.map(a=>{const n=picked(a).length;return `<div class="${n&&n===max?'top':''}"><b>${a.name}</b><span><em>${n}</em> / ${a.items.length}</span></div>`}).join('')}</div>
    ${areas.filter(a=>picked(a).length).map(a=>`<div class="sec"><h3>${a.name}</h3>${picked(a).map(item).join('')}</div>`).join('')}
    <div class="btns"><button class="secondary" id="copy" ${totalO?'':'disabled'}>결과 복사</button><button class="primary" id="again">다시 풀기</button></div>
    <p class="toast" id="toast"></p>
    <div id="copyFallback"></div>
    <div class="nav"><button class="link" id="fix">마지막 답 고치기</button></div>`, '진단 결과', false);
  document.getElementById('again').onclick=()=>{answers={};begin();};
  document.getElementById('fix').onclick=()=>{idx=queue.length-1;question();};
  document.getElementById('copy').onclick=()=>{
    const txt=`[이태형T 국어 O/X 결과] ${who}\n`+areas.map(a=>{const p=picked(a);
      return `\n■ ${a.name} (${p.length}/${a.items.length})`+(p.length?'\n'+p.map(it=>`${it.no}. ${it.q}\n`+it.sol.map(s=>' - '+s).join('\n')).join('\n'):'\n 해당 없음');}).join('\n');
    const toast=document.getElementById('toast');
    const fallback=()=>{const box=document.getElementById('copyFallback');
      box.innerHTML='<textarea class="copybox" id="copyText" aria-label="복사할 결과"></textarea>';
      const t=document.getElementById('copyText'); t.value=txt; t.focus(); t.select();
      toast.textContent='아래 글을 길게 눌러 복사해 주세요.';};
    try{navigator.clipboard.writeText(txt).then(()=>{toast.textContent='복사했어요.';},fallback);}catch(e){fallback();}
  };
  if(SHEET_URL){
    const counts={}; areas.forEach(a=>counts[a.name]=picked(a).length);
    save({id:attemptId, mode:MODE, name:student.name, areas:areas.map(a=>a.name), counts, total:totalO,
      answers:AREAS.flatMap(a=>a.items).map(it=>({label:it.label, q:it.q, a:answers[it.id]||''}))});
  }
}

async function save(payload){
  const el=document.getElementById('save'); if(!el) return;
  el.className='save';
  let left=5; el.textContent=`결과 저장 중… 약 ${left}초 남았어요`;
  const tick=setInterval(()=>{ left--; el.textContent=left>0?`결과 저장 중… 약 ${left}초 남았어요`:'결과 저장 중… 거의 다 됐어요'; },1000);
  const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),20000);
  try{
    const r=await fetch(SHEET_URL,{method:'POST',body:JSON.stringify(payload),signal:ctl.signal});
    const j=await r.json(); if(!j.ok) throw new Error(j.error||'저장 실패');
    el.className='save ok'; el.textContent='결과가 저장됐어요.';
  }catch(e){
    el.className='save err';
    el.innerHTML=`저장하지 못했어요. <button class="link" id="retry">다시 저장</button><br><small>${esc(e.name==='AbortError'?'응답 시간 초과':(e.message||String(e)))}</small>`;
    document.getElementById('retry').onclick=()=>save(payload);
  }finally{ clearInterval(tick); clearTimeout(to); }
}

document.addEventListener('keydown',e=>{ if(screen!=='q'||e.metaKey||e.ctrlKey) return;
  if(e.target.closest&&e.target.closest('input,textarea')) return;
  const k=e.key.toLowerCase(); if(k==='o') answer('O'); if(k==='x') answer('X'); });

start();
</script>
</body>
</html>
